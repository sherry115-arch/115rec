<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>朗讀星球｜聲音任務</title><style>
:root{--v:#7865d8;--p:#ff86b0;--ink:#304362}*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:22px;font-family:"Microsoft JhengHei",sans-serif;color:var(--ink);background:linear-gradient(145deg,#dff3ff,#f3e8ff 57%,#fff4d3)}.card{width:min(710px,100%);margin:auto;overflow:hidden;background:#fffdfd;border:3px solid #fff;border-radius:30px;box-shadow:0 22px 55px #58699e45}.hero{position:relative;padding:32px;background:linear-gradient(120deg,#665cc6,#a174e7);color:#fff}.badge{display:inline-block;padding:6px 12px;border-radius:99px;background:#ffffff28;font-size:13px;font-weight:bold}h1{font-size:39px;margin:10px 0 5px}.hero p{margin:0;line-height:1.7}.rocket{position:absolute;right:27px;bottom:14px;font-size:57px;animation:f 2.5s ease-in-out infinite}@keyframes f{50%{transform:translateY(-9px) rotate(5deg)}}.body{padding:25px 33px 34px}.cheer{padding:13px 15px;border-radius:15px;background:#fff3c3;color:#7f5e18;font-weight:bold}.board{margin:19px 0;padding:17px;border:2px solid #e2dafa;border-radius:20px;background:linear-gradient(135deg,#f0edff,#fff7e7)}.board h2{margin:0 0 7px;color:#6954bd;font-size:18px}.board p{margin:0 0 12px;color:#65708a;font-size:13px;line-height:1.7}.tasks{display:grid;grid-template-columns:1fr 1fr;gap:9px}.task{display:flex;gap:8px;align-items:flex-start;padding:10px;border-radius:12px;background:#fff;cursor:pointer;font-size:13px;line-height:1.45}.task input{width:17px;height:17px;accent-color:#7d68da}.task b{color:#6954bd}.bar{height:10px;margin-top:13px;border-radius:9px;overflow:hidden;background:#deddf1}.bar i{display:block;width:0;height:100%;background:linear-gradient(90deg,#77d9c5,#8b70df);transition:.35s}.taskfoot{display:flex;justify-content:space-between;align-items:center;margin-top:9px;font-size:12px;color:#68718b}.smallbtn{border:0;border-radius:10px;background:#ff8eb3;color:white;padding:7px 10px;font-weight:bold;cursor:pointer}.steps{display:flex;gap:6px;margin:20px 0}.step{flex:1;text-align:center;color:#8994ac;font-size:12px}.dot{width:30px;height:30px;margin:auto auto 5px;display:grid;place-items:center;border-radius:50%;background:#edf0f8;font-weight:bold}.active,.done{color:#6855c4}.active .dot{background:#886ce4;color:#fff}.done .dot{background:#73ceb9;color:#fff}label{display:block;margin:15px 0 7px;font-weight:bold}input[type=text]{width:100%;padding:13px;border:2px solid #e2e5f5;border-radius:13px;font:inherit}.record{padding:21px;text-align:center;border:3px dashed #a794e8;border-radius:20px;background:#f5f1ff}.mic{font-size:43px}.timer{font-size:27px;font-weight:bold;letter-spacing:2px}.hint{font-size:13px;color:#707897;margin:5px}.row{display:flex;gap:8px;margin-top:13px}.row button,.download{flex:1;border:0;padding:12px 7px;border-radius:13px;background:#8069d9;color:#fff;font:700 14px inherit;cursor:pointer}.row .stop{background:#ff769e}.row .again{background:#75cdb9}.row button:disabled{opacity:.45}.preview{display:none;margin-top:14px;padding:13px;border-radius:14px;background:#e8faf4}.preview.show{display:block}.preview audio{width:100%;margin:8px 0}.download{display:block;text-decoration:none;background:#4fbca5}.send{width:100%;margin-top:20px;padding:16px;border:0;border-radius:15px;background:linear-gradient(100deg,#ff87ad,#956ee7);color:white;font:700 18px inherit;cursor:pointer;box-shadow:0 8px 0 #d75f8b}.status{display:none;margin-top:17px;padding:14px;border-radius:14px;text-align:center;font-weight:bold}.status.show{display:block}.ok{background:#e5faee;color:#16805b}.error{background:#fff0f2;color:#c54c64}.note{text-align:center;font-size:13px;color:#77809b;line-height:1.7}@media(max-width:520px){.body{padding:22px 17px}.tasks{grid-template-columns:1fr}h1{font-size:34px}}
</style></head><body><main class="card"><header class="hero"><span class="badge">🌟 聲音作業上傳站</span><h1>朗讀星球</h1><p>每一次開口朗讀，都是讓聲音更有力量的練習！</p><div class="rocket">🚀</div></header><section class="body"><div id="cheer" class="cheer"></div><section class="board"><h2>🌟 朗讀任務基地</h2><p><b>每週例行任務：</b>每週錄音當週國語課文、當週英文課文。<br><b>其他自由任務：</b>請每天朗讀一本繪本、一段課外讀物、一篇小短文或英文小讀本。</p><div class="tasks" id="tasks"><label class="task"><input type="checkbox"><span><b>例行</b><br>錄音：當週國語課文</span></label><label class="task"><input type="checkbox"><span><b>例行</b><br>錄音：當週英文課文</span></label><label class="task"><input type="checkbox"><span><b>自由</b><br>朗讀繪本／課外讀物</span></label><label class="task"><input type="checkbox"><span><b>自由</b><br>朗讀小短文／英文小讀本</span></label></div><div class="bar"><i id="fill"></i></div><div class="taskfoot"><span id="taskText">今天完成 0 / 4 個任務</span><button id="boost" class="smallbtn">抽朗讀鼓勵 ✨</button></div></section><div class="steps"><div id="s1" class="step active"><div class="dot">1</div>填姓名</div><div id="s2" class="step"><div class="dot">2</div>錄聲音</div><div id="s3" class="step"><div class="dot">3</div>送任務</div></div><label>我的名字 *</label><input id="name" type="text" maxlength="20" placeholder="請輸入姓名"><label>這次的任務</label><input id="work" type="text" value="朗讀作業"><label>我的線上錄音 *</label><div class="record"><div class="mic">🎙️</div><div id="timer" class="timer">00:00</div><div id="hint" class="hint">按開始錄音後，請允許使用麥克風。</div><div class="row"><button id="start">● 開始錄音</button><button id="stop" class="stop" disabled>■ 停止錄音</button><button id="again" class="again" disabled>↻ 重錄</button></div></div><div id="preview" class="preview"><b>🎧 先聽聽看！</b><audio id="player" controls></audio><a id="download" class="download" download="我的朗讀.wav">⬇ 下載我的 WAV 錄音檔</a></div><button id="send" class="send">把我的聲音送上星球 ✨</button><div id="status" class="status"></div><p class="note">錄音完成後可試聽、下載 WAV 檔，或送到老師的「線上錄音」資料夾。</p></section></main><script>
const URL='https://script.google.com/macros/s/AKfycbxIaCBrMWKnAsL90sioBoI1RJJt_XP__Cixke-2CthfKgeLmp1o2n0JkURb_-qFd_mx/exec',$=s=>document.querySelector(s);let rec,stream,chunks=[],blob,mediaUrl,tick,sec=0;const cheer=['💛 今天的任務：慢慢讀、清楚讀、勇敢讀！','🌈 讀錯沒關係，願意練習就是進步！','⭐ 小小朗讀家，準備讓聲音發光吧！','🦁 深呼吸，抬頭讀，你做得到！'];$('#cheer').textContent=cheer[Math.floor(Math.random()*cheer.length)];function msg(t,k='ok'){$('#status').textContent=t;$('#status').className='status show '+k}function steps(n){[1,2,3].forEach(i=>$('#s'+i).className='step '+(i<n?'done':i===n?'active':''))}function clock(){$('#timer').textContent=String(sec/60|0).padStart(2,'0')+':'+String(sec%60).padStart(2,'0')}$('#name').oninput=()=>steps($('#name').value.trim()?2:1);[...document.querySelectorAll('#tasks input')].forEach(x=>x.onchange=()=>{let n=[...document.querySelectorAll('#tasks input')].filter(a=>a.checked).length;$('#fill').style.width=n*25+'%';$('#taskText').textContent='今天完成 '+n+' / 4 個任務';if(n===4)msg('太棒了！今天的朗讀能量滿格！')});$('#boost').onclick=()=>msg(cheer[Math.floor(Math.random()*cheer.length)]);
async function wav(b){let c=new AudioContext(),a=await c.decodeAudioData(await b.arrayBuffer()),n=a.length*a.numberOfChannels*2,d=new DataView(new ArrayBuffer(44+n)),p=0,w=s=>{for(let x of s)d.setUint8(p++,x.charCodeAt())},u=x=>{d.setUint32(p,x,true);p+=4},h=x=>{d.setUint16(p,x,true);p+=2};w('RIFF');u(36+n);w('WAVEfmt ');u(16);h(1);h(a.numberOfChannels);u(a.sampleRate);u(a.sampleRate*a.numberOfChannels*2);h(a.numberOfChannels*2);h(16);w('data');u(n);for(let i=0;i<a.length;i++)for(let j=0;j<a.numberOfChannels;j++){let x=Math.max(-1,Math.min(1,a.getChannelData(j)[i]));d.setInt16(p,x<0?x*32768:x*32767,true);p+=2}c.close();return new Blob([d],{type:'audio/wav'})}
$('#start').onclick=async()=>{try{stream=await navigator.mediaDevices.getUserMedia({audio:true});rec=new MediaRecorder(stream);chunks=[];rec.ondataavailable=e=>chunks.push(e.data);rec.onstop=async()=>{try{blob=await wav(new Blob(chunks,{type:rec.mimeType}));mediaUrl=URL.createObjectURL(blob);$('#player').src=mediaUrl;$('#download').href=mediaUrl;$('#download').download=($('#name').value||'我的朗讀')+'.wav';$('#preview').classList.add('show');$('#hint').textContent='錄音完成！先試聽，滿意後再送出。';steps(3)}catch(e){msg('轉換 WAV 失敗，請使用 Chrome 或 Edge 再試。','error')}stream.getTracks().forEach(x=>x.stop())};rec.start();sec=0;clock();tick=setInterval(()=>{sec++;clock()},1000);$('#start').disabled=true;$('#stop').disabled=false;$('#again').disabled=true;$('#hint').textContent='🔴 錄音中…請清楚、慢慢地朗讀！'}catch(e){msg('需要允許麥克風才能開始錄音。','error')}};$('#stop').onclick=()=>{rec.stop();clearInterval(tick);$('#start').disabled=false;$('#stop').disabled=true;$('#again').disabled=false};$('#again').onclick=()=>{blob=null;$('#preview').classList.remove('show');sec=0;clock();$('#again').disabled=true;$('#hint').textContent='準備好了，再錄一次更棒的朗讀吧！';steps($('#name').value.trim()?2:1)};function b64(x){return new Promise((y,n)=>{let r=new FileReader();r.onload=()=>y(r.result.split(',')[1]);r.onerror=n;r.readAsDataURL(x)})}$('#send').onclick=async()=>{if(!$('#name').value.trim())return msg('先寫下你的名字，再開始任務喔！','error');if(!blob)return msg('請先完成錄音並試聽喔！','error');let b=$('#send');b.disabled=true;b.textContent='火箭準備發射中…';try{let q=new URLSearchParams({student:$('#name').value.trim(),assignment:$('#work').value.trim()||'朗讀作業',fileName:$('#name').value.trim()+'.wav',mimeType:'audio/wav',data:await b64(blob)});await fetch(URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'application/x-www-form-urlencoded;charset=UTF-8'},body:q});msg('🏆 任務送出成功！你的朗讀聲音已經出發囉！')}catch(e){msg('送出沒有成功，請確認網路後再試。','error')}finally{b.disabled=false;b.textContent='把我的聲音送上星球 ✨'}};</script></body></html>
