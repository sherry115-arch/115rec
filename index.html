<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>朗讀星球｜上傳站</title><style>
:root{--n:#314467;--p:#886de6;--pink:#ff8db2}*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:"Microsoft JhengHei",sans-serif;color:var(--n);background:linear-gradient(160deg,#dff2ff,#f4e8ff 55%,#fff5d8);padding:24px}.stars{position:fixed;inset:0;pointer-events:none;background-image:radial-gradient(#fff 1.5px,transparent 2px);background-size:58px 58px;opacity:.6}main{position:relative;max-width:720px;margin:auto}.planet{position:absolute;right:-45px;top:-42px;width:145px;height:145px;border-radius:50%;background:linear-gradient(135deg,#ffc767,#ff8bab);box-shadow:inset -22px -15px #ef7e9e;z-index:-1}.card{overflow:hidden;border:3px solid #fff;background:#fffc;box-shadow:0 20px 55px #6273aa3d;border-radius:32px}.hero{padding:35px 34px 26px;background:linear-gradient(120deg,#7163cf,#9774e7);color:#fff;position:relative}.badge{display:inline-block;background:#ffffff2b;padding:6px 12px;border-radius:99px;font-size:13px;font-weight:bold}h1{margin:11px 0 6px;font-size:clamp(29px,7vw,42px)}.hero p{margin:0;line-height:1.7}.rocket{position:absolute;right:28px;bottom:18px;font-size:58px;animation:f 2.5s ease-in-out infinite}@keyframes f{50%{transform:translateY(-9px) rotate(5deg)}}.body{padding:25px 34px 34px}.cheer{padding:13px 16px;background:#fff5c8;border-radius:16px;color:#805f19;font-weight:bold;line-height:1.55}.steps{display:flex;gap:7px;margin:20px 0}.step{flex:1;text-align:center;font-size:12px;color:#8994ac}.dot{width:31px;height:31px;display:grid;place-items:center;margin:auto auto 5px;border-radius:50%;background:#edf0f8;font-weight:bold}.active{color:#6c55c8}.active .dot{background:#8d70e6;color:#fff}.done .dot{background:#76cfbd;color:#fff}label{display:block;font-weight:700;margin:15px 0 7px}input{font:inherit;width:100%;padding:13px 14px;border:2px solid #e1e5f6;border-radius:14px;color:var(--n);outline:0;background:#fff}input:focus{border-color:#9276e4;box-shadow:0 0 0 4px #9276e41b}.need{color:#e75c82}.drop{display:block;margin-top:8px;border:3px dashed #a994e9;border-radius:20px;padding:25px 16px;text-align:center;background:#f5f2ff;cursor:pointer;transition:.2s}.drop:hover,.drag{border-color:#ff8db2;background:#fff1f7;transform:scale(1.01)}.mic{font-size:42px}.drop strong{font-size:18px}.drop small{display:block;color:#6d7592;margin-top:8px}.file{min-height:24px;margin:10px 4px;color:#5d6391;word-break:break-all;font-weight:bold}.preview{display:none;margin-top:12px;padding:11px;background:#eafff8;border-radius:13px}.preview.show{display:flex;gap:10px;align-items:center}.preview audio{width:100%}button{width:100%;margin-top:20px;padding:16px;border:0;border-radius:15px;background:linear-gradient(100deg,#ff8aac,#9a71e7);color:#fff;font:700 18px inherit;cursor:pointer;box-shadow:0 8px 0 #d8608c}button:hover{transform:translateY(-2px)}button:disabled{opacity:.6}.status{display:none;margin-top:20px;padding:15px;border-radius:15px;text-align:center;font-weight:bold;line-height:1.7}.show{display:block}.ok{background:#e5faee;color:#16805b}.error{background:#fff0f2;color:#c54c64}.note{font-size:13px;color:#77809b;line-height:1.7;text-align:center}.celebrate{display:none;position:fixed;inset:0;z-index:5;background:#fffdfbe8;place-items:center;padding:20px;text-align:center}.celebrate.show{display:grid}.success{max-width:390px;background:#fff;border-radius:29px;padding:30px;box-shadow:0 20px 60px #44336a33}.big{font-size:72px;animation:pop .6s cubic-bezier(.2,1.6,.4,1)}@keyframes pop{from{transform:scale(.1)}to{transform:scale(1)}}.success h2{color:#7256d1}.success button{background:#7ccdbd;box-shadow:0 7px 0 #4fb09f}
.layout{display:flex;min-height:100vh;}.sidebar{width:200px;background:rgba(255,255,255,0.1);padding:1rem;overflow:auto;}.content{flex:1;padding:1rem;}</style></head><body>
<div class="layout">
  <aside class="sidebar">
    <h2>功能選單</h2>
    <ul>
      <li><a href="#">錄音上傳</a></li>
      <li><a href="#">說明</a></li>
    </ul>
  </aside>
  <div class="content"><div class="stars"></div><main><div class="planet"></div><section class="card"><header class="hero"><span class="badge">🌟 聲音作業上傳站</span><h1>朗讀星球</h1><p>每一次開口朗讀，都是讓聲音更有力量的練習！</p><div class="rocket">🚀</div></header><div class="body"><div id="cheer" class="cheer"></div><div class="steps"><div class="step active" id="s1"><div class="dot">1</div>填姓名</div><div class="step" id="s2"><div class="dot">2</div>選錄音</div><div class="step" id="s3"><div class="dot">3</div>送出任務</div></div><label>我的名字 <span class="need">*</span></label><input id="student" maxlength="20" placeholder="請輸入姓名"><label>這次的任務</label><input id="assignment" maxlength="40" value="朗讀作業"><label>我的錄音檔 <span class="need">*</span></label><label id="drop" class="drop" for="audio"><div class="mic">🎙️</div><strong>點我選擇錄音檔</strong><small>也可以把檔案拖到這裡｜mp3、m4a、wav｜上限 50 MB</small></label><input id="audio" type="file" accept="audio/*,.m4a,.mp3,.wav,.aac,.ogg" hidden><div id="file" class="file"></div><div id="preview" class="preview"><span>▶️</span><audio id="player" controls></audio></div><button id="send">把我的聲音送上星球 ✨</button><div id="status" class="status"></div><p class="note">完成後會送到老師的「線上錄音」資料夾。<br>送出前，別忘了再聽一次自己的精彩朗讀！</p></div></section></main><div id="celebrate" class="celebrate"><div class="success"><div class="big">🏆</div><h2>任務送出成功！</h2><p>你完成了今天的朗讀挑戰。<br>每一次練習，都讓你更棒！</p><button onclick="location.reload()">再送一個錄音</button></div></div><script>
const SCRIPT_URL='請在這裡貼上你的_Google_Apps_Script_網址',MAX=50*1024*1024,a=document.querySelector('#audio'),d=document.querySelector('#drop'),n=document.querySelector('#student'),w=document.querySelector('#assignment'),f=document.querySelector('#file'),b=document.querySelector('#send'),st=document.querySelector('#status'),pv=document.querySelector('#preview'),pl=document.querySelector('#player');const cheers=['💛 今天的任務：慢慢讀、清楚讀、勇敢讀！','🌈 讀錯沒關係，願意練習就是進步！','⭐ 小小朗讀家，準備讓聲音發光吧！','🦁 深呼吸，抬頭讀，你做得到！'];cheer.textContent=cheers[Math.floor(Math.random()*cheers.length)];function step(x){[1,2,3].forEach(i=>document.querySelector('#s'+i).className='step '+(i<x?'done':i===x?'active':''))}function msg(x,k='ok'){st.textContent=x;st.className='status show '+k}n.oninput=()=>step(n.value.trim()?2:1);function pick(x){if(!x)return;if(x.size>MAX){a.value='';return msg('這個檔案超過 50 MB，請換一個小一點的錄音。','error')}if(!x.type.startsWith('audio/')&&!/\.(mp3|m4a|wav|aac|ogg)$/i.test(x.name)){a.value='';return msg('請選擇錄音檔。','error')}f.textContent='🎵 已選擇：'+x.name+'（'+(x.size/1048576).toFixed(1)+' MB）';pl.src=URL.createObjectURL(x);pv.classList.add('show');st.className='status';step(3)}a.onchange=()=>pick(a.files[0]);['dragenter','dragover'].forEach(x=>d.addEventListener(x,e=>{e.preventDefault();d.classList.add('drag')}));['dragleave','drop'].forEach(x=>d.addEventListener(x,e=>{e.preventDefault();d.classList.remove('drag')}));d.addEventListener('drop',e=>{let x=e.dataTransfer.files[0];if(x){let t=new DataTransfer();t.items.add(x);a.files=t.files;pick(x)}});function base(x){return new Promise((y,z)=>{let r=new FileReader();r.onload=()=>y(r.result.split(',')[1]);r.onerror=z;r.readAsDataURL(x)})}b.onclick=async()=>{let x=a.files[0],student=n.value.trim(),work=w.value.trim()||'朗讀作業';if(!student)return msg('先寫下你的名字，再開始任務喔！','error');if(!x)return msg('先選擇你的朗讀錄音檔喔！','error');if(SCRIPT_URL.includes('請在這裡'))return msg('老師正在設定收件星球，請稍後再試。','error');b.disabled=true;b.textContent='火箭準備發射中…';try{let q=new URLSearchParams({student,assignment:work,fileName:x.name,mimeType:x.type||'audio/mpeg',data:await base(x)});await fetch(SCRIPT_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'application/x-www-form-urlencoded;charset=UTF-8'},body:q});celebrate.classList.add('show')}catch(e){msg('送出沒有成功，請確認網路後再試一次。','error')}finally{b.disabled=false;b.textContent='把我的聲音送上星球 ✨'}};
</script></body></html>
