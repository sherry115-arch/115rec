<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>朗讀星球｜聲音任務</title>
<style>
:root{--violet:#7665d5;--pink:#ff88af;--ink:#304362}*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:24px;font-family:"Microsoft JhengHei",sans-serif;color:var(--ink);background:linear-gradient(145deg,#dff3ff,#f3e9ff 58%,#fff5d9)}.stars{position:fixed;inset:0;pointer-events:none;background-image:radial-gradient(#fff 1.4px,transparent 2px);background-size:61px 61px;opacity:.7}.card{position:relative;width:min(710px,100%);margin:auto;overflow:hidden;border:3px solid #fff;border-radius:32px;background:#fffdfde8;box-shadow:0 22px 55px #58699e40}.hero{position:relative;padding:34px;background:linear-gradient(120deg,#665cc6,#a174e7);color:#fff}.badge{display:inline-block;padding:6px 12px;border-radius:99px;background:#ffffff28;font-size:13px;font-weight:bold}h1{font-size:40px;margin:10px 0 5px}.hero p{margin:0;line-height:1.7}.rocket{position:absolute;right:30px;bottom:17px;font-size:60px;animation:fly 2.5s ease-in-out infinite}@keyframes fly{50%{transform:translateY(-9px) rotate(6deg)}}.body{padding:26px 34px 34px}.cheer{padding:13px 16px;background:#fff4c4;border-radius:15px;color:#7f5e18;font-weight:bold}.steps{display:flex;gap:6px;margin:20px 0}.step{flex:1;text-align:center;color:#8994ac;font-size:12px}.dot{width:30px;height:30px;margin:auto auto 5px;display:grid;place-items:center;border-radius:50%;background:#edf0f8;font-weight:bold}.active,.done{color:#6855c4}.active .dot{background:#886ce4;color:#fff}.done .dot{background:#73ceb9;color:#fff}label{display:block;font-weight:bold;margin:16px 0 7px}input{width:100%;padding:13px;border:2px solid #e2e5f5;border-radius:13px;font:inherit;outline:0}input:focus{border-color:#9176e4}.need{color:#dc597c}.recordBox{padding:22px 16px;border:3px dashed #a794e8;border-radius:20px;text-align:center;background:#f5f1ff}.mic{font-size:45px}.timer{font-size:27px;font-weight:bold;letter-spacing:2px;margin:6px}.hint{font-size:13px;color:#707897}.recordRow{display:flex;gap:9px;margin-top:14px}.recordRow button,.download{flex:1;border:0;padding:12px 8px;border-radius:13px;background:#8069d9;color:#fff;font:700 15px inherit;cursor:pointer}.recordRow .stop{background:#ff769e}.recordRow .again{background:#75cdb9}.recordRow button:disabled{opacity:.45;cursor:not-allowed}.preview{display:none;margin-top:15px;padding:13px;background:#e8faf4;border-radius:14px}.preview.show{display:block}.preview audio{width:100%;margin:8px 0}.download{display:block;text-decoration:none;text-align:center;background:#4fbca5;margin-top:6px}.send{width:100%;margin-top:21px;padding:16px;border:0;border-radius:15px;background:linear-gradient(100deg,#ff87ad,#956ee7);color:#fff;font:700 18px inherit;cursor:pointer;box-shadow:0 8px 0 #d75f8b}.send:disabled{opacity:.55}.status{display:none;margin-top:18px;padding:14px;border-radius:14px;text-align:center;font-weight:bold}.status.show{display:block}.ok{background:#e5faee;color:#16805b}.error{background:#fff0f2;color:#c54c64}.note{text-align:center;font-size:13px;color:#77809b;line-height:1.7}.celebrate{display:none;position:fixed;inset:0;z-index:5;place-items:center;background:#fffdfbe8;text-align:center}.celebrate.show{display:grid}.success{padding:31px;border-radius:28px;background:#fff;box-shadow:0 18px 55px #44336a33}.big{font-size:70px}.success button{border:0;border-radius:13px;background:#77cbb9;color:#fff;font:700 16px inherit;padding:12px 25px}
</style></head><body><div class="stars"></div><main class="card"><header class="hero"><span class="badge">🌟 聲音作業上傳站</span><h1>朗讀星球</h1><p>每一次開口朗讀，都是讓聲音更有力量的練習！</p><div class="rocket">🚀</div></header><section class="body"><div id="cheer" class="cheer"></div><div class="steps"><div id="s1" class="step active"><div class="dot">1</div>填姓名</div><div id="s2" class="step"><div class="dot">2</div>錄聲音</div><div id="s3" class="step"><div class="dot">3</div>送任務</div></div><label>我的名字 <span class="need">*</span></label><input id="student" maxlength="20" placeholder="請輸入姓名"><label>這次的任務</label><input id="assignment" maxlength="40" value="朗讀作業"><label>我的線上錄音 <span class="need">*</span></label><section class="recordBox"><div class="mic" id="mic">🎙️</div><div class="timer" id="timer">00:00</div><div id="hint" class="hint">按「開始錄音」後，請允許使用麥克風。</div><div class="recordRow"><button id="start">● 開始錄音</button><button id="stop" class="stop" disabled>■ 停止錄音</button><button id="reset" class="again" disabled>↻ 重錄</button></div></section><section id="preview" class="preview"><b>🎧 先聽聽看！</b><audio id="player" controls></audio><a id="download" class="download" download="我的朗讀.wav">⬇ 下載我的 WAV 錄音檔</a></section><button id="send" class="send">把我的聲音送上星球 ✨</button><div id="status" class="status"></div><p class="note">錄音完成後可試聽、下載 WAV 檔，或送到老師的「線上錄音」資料夾。</p></section></main><div id="celebrate" class="celebrate"><div class="success"><div class="big">🏆</div><h2>任務送出成功！</h2><p>你的朗讀聲音已經出發到星球囉！</p><button onclick="location.reload()">再錄一個</button></div></div>
<script>
const SCRIPT_URL='https://script.google.com/macros/s/AKfycbxIaCBrMWKnAsL90sioBoI1RJJt_XP__Cixke-2CthfKgeLmp1o2n0JkURb_-qFd_mx/exec',MAX=50*1024*1024;
const $=x=>document.querySelector(x),student=$('#student'),task=$('#assignment'),start=$('#start'),stop=$('#stop'),reset=$('#reset'),timer=$('#timer'),hint=$('#hint'),player=$('#player'),preview=$('#preview'),download=$('#download'),send=$('#send'),status=$('#status'),cheer=$('#cheer'),celebrate=$('#celebrate');let recorder,stream,chunks=[],audioBlob,url,tick,seconds=0;
$('#cheer').textContent=['💛 今天的任務：慢慢讀、清楚讀、勇敢讀！','🌈 讀錯沒關係，願意練習就是進步！','⭐ 小小朗讀家，準備讓聲音發光吧！','🦁 深呼吸，抬頭讀，你做得到！'][Math.floor(Math.random()*4)];
function msg(t,k='ok'){status.textContent=t;status.className='status show '+k}function step(x){[1,2,3].forEach(i=>$('#s'+i).className='step '+(i<x?'done':i===x?'active':''))}student.oninput=()=>step(student.value.trim()?2:1);function time(){timer.textContent=String(Math.floor(seconds/60)).padStart(2,'0')+':'+String(seconds%60).padStart(2,'0')}
async function toWav(blob){const ctx=new (window.AudioContext||window.webkitAudioContext)(),buf=await ctx.decodeAudioData(await blob.arrayBuffer()),len=buf.length*buf.numberOfChannels*2,ab=new ArrayBuffer(44+len),v=new DataView(ab);let p=0,w=s=>{for(let i=0;i<s.length;i++)v.setUint8(p++,s.charCodeAt(i))},u=x=>{v.setUint32(p,x,true);p+=4},h=x=>{v.setUint16(p,x,true);p+=2};w('RIFF');u(36+len);w('WAVEfmt ');u(16);h(1);h(buf.numberOfChannels);u(buf.sampleRate);u(buf.sampleRate*buf.numberOfChannels*2);h(buf.numberOfChannels*2);h(16);w('data');u(len);for(let i=0;i<buf.length;i++)for(let c=0;c<buf.numberOfChannels;c++){let s=Math.max(-1,Math.min(1,buf.getChannelData(c)[i]));v.setInt16(p,s<0?s*32768:s*32767,true);p+=2}ctx.close();return new Blob([ab],{type:'audio/wav'})}
start.onclick=async()=>{try{stream=await navigator.mediaDevices.getUserMedia({audio:true});let opt={};for(const type of ['audio/webm;codecs=opus','audio/ogg;codecs=opus','audio/webm'])if(MediaRecorder.isTypeSupported(type)){opt.mimeType=type;break}recorder=new MediaRecorder(stream,opt);chunks=[];recorder.ondataavailable=e=>chunks.push(e.data);recorder.onstop=async()=>{hint.textContent='正在把錄音整理成 WAV 檔…';try{audioBlob=await toWav(new Blob(chunks,{type:recorder.mimeType}));if(audioBlob.size>MAX)throw Error();url=URL.createObjectURL(audioBlob);player.src=url;download.href=url;download.download=(student.value.trim()||'我的朗讀')+'.wav';preview.classList.add('show');hint.textContent='錄音完成！先試聽，滿意後再送出。';step(3)}catch(e){msg('錄音轉檔失敗，請改用 Chrome 或 Edge 再試。','error')}stream.getTracks().forEach(t=>t.stop())};recorder.start();seconds=0;time();tick=setInterval(()=>{seconds++;time()},1000);start.disabled=true;stop.disabled=false;reset.disabled=true;hint.textContent='🔴 錄音中…請清楚、慢慢地朗讀！'}catch(e){msg('需要允許使用麥克風，才能開始錄音。','error')}};stop.onclick=()=>{recorder.stop();clearInterval(tick);start.disabled=false;stop.disabled=true;reset.disabled=false};reset.onclick=()=>{if(url)URL.revokeObjectURL(url);audioBlob=null;preview.classList.remove('show');seconds=0;time();hint.textContent='準備好了，再錄一次更棒的朗讀吧！';reset.disabled=true;step(student.value.trim()?2:1)};
function base(x){return new Promise((yes,no)=>{let r=new FileReader();r.onload=()=>yes(r.result.split(',')[1]);r.onerror=no;r.readAsDataURL(x)})}send.onclick=async()=>{if(!student.value.trim())return msg('先寫下你的名字，再開始任務喔！','error');if(!audioBlob)return msg('請先完成錄音並試聽喔！','error');if(SCRIPT_URL.includes('請在這裡'))return msg('老師正在設定收件星球，請稍後再試。','error');send.disabled=true;send.textContent='火箭準備發射中…';try{let q=new URLSearchParams({student:student.value.trim(),assignment:task.value.trim()||'朗讀作業',fileName:(student.value.trim()||'朗讀')+'.wav',mimeType:'audio/wav',data:await base(audioBlob)});await fetch(SCRIPT_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'application/x-www-form-urlencoded;charset=UTF-8'},body:q});$('#celebrate').classList.add('show')}catch(e){msg('送出沒有成功，請確認網路後再試。','error')}finally{send.disabled=false;send.textContent='把我的聲音送上星球 ✨'}};
</script></body></html>
