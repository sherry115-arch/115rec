<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>朗讀星球｜錄音與試聽</title><style>body{margin:0;padding:24px;font-family:"Microsoft JhengHei";background:linear-gradient(135deg,#dff3ff,#f6eaff);color:#33446a}.box{max-width:620px;margin:auto;background:#fff;border-radius:28px;overflow:hidden;box-shadow:0 18px 45px #6673aa44}.hero{padding:30px;background:linear-gradient(120deg,#675ccb,#a476e7);color:white}h1{margin:7px 0;font-size:37px}.body{padding:25px}.mission,.listen{margin:18px 0;padding:17px;border-radius:18px}.mission{background:#f1edff;border:2px solid #ded5f8}.mission p{line-height:1.7;font-size:14px}.listen{background:#e8faf2;border:2px solid #a7e4d5}.listen h2{margin:0 0 6px;color:#247c68;font-size:19px}.listen audio{width:100%;margin:10px 0}.record{padding:20px;text-align:center;border:3px dashed #a894e7;border-radius:18px;background:#f6f2ff}.timer{font-size:27px;font-weight:bold}button,a{border:0;border-radius:12px;padding:13px;background:#8069d9;color:white;font-weight:bold;cursor:pointer;text-decoration:none}button:disabled{opacity:.4}.row{display:flex;gap:9px;margin-top:12px}.row>*{flex:1}.stop{background:#ff769e}.try{background:#52bda7}.download{display:block;text-align:center;background:#5791d8}.send{width:100%;margin-top:15px;background:linear-gradient(100deg,#ff85ad,#906de6)}input{box-sizing:border-box;width:100%;padding:12px;border:2px solid #e0e3f2;border-radius:12px;font:inherit;margin:6px 0 14px}.tip{font-size:13px;color:#64718d}.status{text-align:center;margin-top:13px;font-weight:bold}</style><body><main class="box"><header class="hero">🌟 聲音作業上傳站<h1>朗讀星球 🎙️</h1>先錄音、再試聽、確認後送出！</header><section class="body"><section class="mission"><b>🌟 朗讀任務基地</b><p><b>每週例行任務：</b>錄音當週國語課文、當週英文課文。<br><b>自由任務：</b>每天朗讀繪本、課外讀物、小短文或英文小讀本。</p></section><label>我的名字</label><input id="name" placeholder="請輸入姓名"><label>這次的任務</label><input id="work" value="朗讀作業"><section class="record"><div style="font-size:42px">🎙️</div><div id="timer" class="timer">00:00</div><div class="tip" id="hint">按開始錄音後，請允許麥克風。</div><div class="row"><button id="start">● 開始錄音</button><button id="stop" class="stop" disabled>■ 停止錄音</button></div></section><section class="listen"><h2>🎧 線上試聽區</h2><div class="tip" id="listenTip">停止錄音後，這裡會立刻出現你的聲音。</div><audio id="audio" controls></audio><div class="row"><button id="play" class="try" disabled>▶ 試聽我的錄音</button><a id="download" class="download">⬇ 下載錄音檔</a></div></section><button id="send" class="send">把我的聲音送上星球 ✨</button><div id="status" class="status"></div></section></main><script>const GAS='https://script.google.com/macros/s/AKfycbxIaCBrMWKnAsL90sioBoI1RJJt_XP__Cixke-2CthfKgeLmp1o2n0JkURb_-qFd_mx/exec',$=x=>document.querySelector(x);let r,s,c=[],f,u,t=0,id;function clock(){$('#timer').textContent=String(t/60|0).padStart(2,'0')+':'+String(t%60).padStart(2,'0')}function say(x){$('#status').textContent=x}$('#start').onclick=async()=>{try{s=await navigator.mediaDevices.getUserMedia({audio:true});r=new MediaRecorder(s);c=[];r.ondataavailable=e=>c.push(e.data);r.onstop=()=>{f=new Blob(c,{type:r.mimeType});u=URL.createObjectURL(f);$('#audio').src=u;$('#audio').load();$('#play').disabled=false;$('#download').href=u;$('#download').download=($('#name').value||'我的朗讀')+'.webm';$('#listenTip').textContent='錄音完成！現在可以按下方綠色按鈕試聽。';s.getTracks().forEach(x=>x.stop())};r.start();t=0;clock();id=setInterval(()=>{t++;clock()},1000);$('#start').disabled=true;$('#stop').disabled=false}catch(e){say('請允許使用麥克風。')}};$('#stop').onclick=()=>{r.stop();clearInterval(id);$('#start').disabled=false;$('#stop').disabled=true};$('#play').onclick=()=>{let a=$('#audio');if(a.paused){a.play();$('#play').textContent='❚❚ 暫停試聽'}else{a.pause();$('#play').textContent='▶ 繼續試聽'}};$('#audio').onended=()=>$('#play').textContent='▶ 再聽一次';function b64(x){return new Promise(y=>{let q=new FileReader();q.onload=()=>y(q.result.split(',')[1]);q.readAsDataURL(x)})}$('#send').onclick=async()=>{if(!f)return say('請先錄音並試聽。');say('正在送出…');await fetch(GAS,{method:'POST',mode:'no-cors',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:new URLSearchParams({student:$('#name').value,assignment:$('#work').value,fileName:($('#name').value||'朗讀')+'.webm',mimeType:f.type,data:await b64(f)})});say('🏆 任務送出成功！')};</script></body></html>
